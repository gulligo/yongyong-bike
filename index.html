<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>용용이 바이크</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f172a; --card: #1e293b; --line: #334155; --text: #f1f5f9; --sub: #94a3b8;
    --wheel: #38bdf8; --part: #fbbf24; --service: #4ade80; --red: #f87171;
  }
  body { font-family: -apple-system, 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
  header { padding: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  header h1 { font-size: 22px; }
  #syncState { font-size: 12px; color: var(--sub); }
  main { padding: 0 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h3 { font-size: 15px; margin-bottom: 10px; color: var(--sub); font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; }
  .chip { padding: 7px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); color: var(--text); font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .l { flex: 1; min-width: 0; }
  .row .t { font-size: 15px; }
  .row .s { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .row .r { text-align: right; font-size: 14px; white-space: nowrap; margin-left: 10px; }
  .tag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .wheel { background: var(--wheel); } .part { background: var(--part); } .service { background: var(--service); }
  .empty { color: var(--sub); text-align: center; padding: 20px 0; font-size: 14px; }
  .big { font-size: 26px; font-weight: 700; }
  .kmbox { display: flex; justify-content: space-between; align-items: center; }
  .btn { background: var(--line); color: var(--text); border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; }
  .btn.main { background: var(--wheel); color: var(--bg); font-weight: 700; }
  .btn.del { background: var(--red); color: var(--bg); }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); z-index: 20; }
  nav button { flex: 1; background: none; border: none; color: var(--sub); padding: 12px 0 16px; font-size: 13px; }
  nav button.on { color: var(--text); font-weight: 700; }
  .fab { position: fixed; right: 18px; bottom: 80px; width: 56px; height: 56px; border-radius: 50%; background: var(--wheel); color: var(--bg); font-size: 30px; border: none; z-index: 20; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 30; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px 28px; }
  .sheet h2 { font-size: 18px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 5px; }
  input, select, textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px; font-size: 16px; font-family: inherit; }
  textarea { min-height: 60px; resize: vertical; }
  .types { display: flex; gap: 8px; }
  .types button { flex: 1; padding: 11px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px; }
  .types button.on[data-t="wheel"] { background: var(--wheel); color: var(--bg); }
  .types button.on[data-t="part"] { background: var(--part); color: var(--bg); }
  .types button.on[data-t="service"] { background: var(--service); color: var(--bg); }
  .two { display: flex; gap: 10px; } .two > div { flex: 1; }
  .acts { display: flex; gap: 10px; margin-top: 18px; } .acts .btn { flex: 1; padding: 13px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .w { text-align: center; font-size: 12px; color: var(--sub); padding: 4px 0; }
  .cal .d { aspect-ratio: 1; background: var(--bg); border-radius: 8px; font-size: 13px; padding: 4px; display: flex; flex-direction: column; align-items: center; }
  .cal .d.sel { outline: 2px solid var(--text); }
  .cal .d.today { color: var(--wheel); font-weight: 700; }
  .cal .d .dots { display: flex; gap: 2px; margin-top: auto; margin-bottom: 3px; }
  .cal .d .dots span { width: 6px; height: 6px; border-radius: 50%; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bars .b i { width: 100%; background: var(--wheel); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bars .b span { font-size: 10px; color: var(--sub); margin-top: 4px; }
  .sum3 { display: flex; gap: 8px; }
  .sum3 > div { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .sum3 .n { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .sum3 .k { font-size: 12px; color: var(--sub); }
  .hide { display: none; }
</style>
</head>
<body>

<header>
  <h1>🚲 용용이 바이크</h1>
  <span id="syncState"></span>
</header>

<main>
  <div class="chips" id="bikeChips"></div>

  <!-- 홈 -->
  <section id="tab-home">
    <div class="card" id="kmCard">
      <h3>현재 누적 거리</h3>
      <div class="kmbox">
        <div class="big" id="kmNow">0 km</div>
        <button class="btn" onclick="editKm()">수정</button>
      </div>
    </div>
    <div class="card">
      <h3>마지막 교체·정비 이후</h3>
      <div id="sinceList"></div>
    </div>
    <div class="card">
      <h3>최근 기록</h3>
      <div id="recentList"></div>
    </div>
  </section>

  <!-- 기록 -->
  <section id="tab-list" class="hide">
    <div class="chips" id="typeChips"></div>
    <div class="card"><div id="allList"></div></div>
  </section>

  <!-- 달력 -->
  <section id="tab-cal" class="hide">
    <div class="card">
      <div class="cal-head">
        <button class="btn" onclick="moveMonth(-1)">◀</button>
        <b id="calTitle"></b>
        <button class="btn" onclick="moveMonth(1)">▶</button>
      </div>
      <div class="cal" id="calGrid"></div>
    </div>
    <div class="card"><h3 id="dayTitle"></h3><div id="dayList"></div></div>
  </section>

  <!-- 통계 -->
  <section id="tab-stat" class="hide">
    <div class="card">
      <div class="cal-head">
        <button class="btn" onclick="moveYear(-1)">◀</button>
        <b id="yearTitle"></b>
        <button class="btn" onclick="moveYear(1)">▶</button>
      </div>
      <div class="big" id="yearTotal" style="text-align:center;margin:6px 0 12px"></div>
      <div class="sum3" id="yearByType"></div>
    </div>
    <div class="card">
      <h3>월별 비용</h3>
      <div class="bars" id="monthBars"></div>
    </div>
    <div class="card">
      <h3>품목별 비용 (전체 기간)</h3>
      <div id="itemCost"></div>
    </div>
  </section>

  <!-- 설정 -->
  <section id="tab-set" class="hide">
    <div class="card">
      <h3>자전거</h3>
      <div id="bikeList"></div>
      <button class="btn main" style="width:100%;margin-top:10px" onclick="openBike()">+ 자전거 추가</button>
    </div>
    <div class="card">
      <h3>백업</h3>
      <div class="two">
        <button class="btn" style="flex:1" onclick="exportJson()">내보내기</button>
        <button class="btn" style="flex:1" onclick="document.getElementById('importFile').click()">불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json" class="hide" onchange="importJson(event)">
    </div>
  </section>
</main>

<button class="fab" onclick="openRec()">＋</button>

<nav>
  <button data-tab="home" class="on">홈</button>
  <button data-tab="list">기록</button>
  <button data-tab="cal">달력</button>
  <button data-tab="stat">통계</button>
  <button data-tab="set">설정</button>
</nav>

<!-- 기록 입력 -->
<div class="modal" id="recModal">
  <div class="sheet">
    <h2 id="recTitle">기록 추가</h2>
    <div class="types">
      <button data-t="wheel">🛞 바퀴</button>
      <button data-t="part">🔩 소모품</button>
      <button data-t="service">🔧 정비</button>
    </div>
    <label>자전거</label>
    <select id="fBike"></select>
    <div class="two">
      <div><label>날짜</label><input type="date" id="fDate"></div>
      <div><label>누적 km</label><input type="number" id="fKm" inputmode="numeric" placeholder="선택"></div>
    </div>
    <label>품목</label>
    <input id="fItem" list="itemList" placeholder="예: 뒤 타이어">
    <datalist id="itemList"></datalist>
    <label>제품명</label>
    <input id="fProduct" placeholder="예: 맥시스 미니언 DHF 29x2.5">
    <div class="two">
      <div><label>가격 (원)</label><input type="number" id="fPrice" inputmode="numeric" placeholder="0"></div>
      <div><label id="fPlaceLabel">구매처</label><input id="fPlace" placeholder="선택"></div>
    </div>
    <label>메모</label>
    <textarea id="fMemo"></textarea>
    <div class="acts">
      <button class="btn del hide" id="recDel" onclick="delRec()">삭제</button>
      <button class="btn" onclick="closeModal('recModal')">취소</button>
      <button class="btn main" onclick="saveRec()">저장</button>
    </div>
  </div>
</div>

<!-- 자전거 입력 -->
<div class="modal" id="bikeModal">
  <div class="sheet">
    <h2 id="bikeTitle">자전거 추가</h2>
    <label>이름</label>
    <input id="bName" placeholder="예: MTB">
    <label>현재 누적 km</label>
    <input type="number" id="bKm" inputmode="numeric" placeholder="0">
    <div class="acts">
      <button class="btn del hide" id="bikeDel" onclick="delBike()">삭제</button>
      <button class="btn" onclick="closeModal('bikeModal')">취소</button>
      <button class="btn main" onclick="saveBike()">저장</button>
    </div>
  </div>
</div>

<script>
// ===== 설정 (Worker 주소와 키를 바꿔 주세요) =====
const API = 'https://yongyong-bike.YOUR-SUBDOMAIN.workers.dev/data';
const KEY = 'yongyong-1234';
const LS = 'yongyong-bike-data';

const TYPES = {
  wheel:   { name: '바퀴',   icon: '🛞', place: '구매처' },
  part:    { name: '소모품', icon: '🔩', place: '구매처' },
  service: { name: '정비',   icon: '🔧', place: '정비한 곳' }
};
const ITEMS = {
  wheel:   ['앞 타이어', '뒤 타이어', '앞 휠', '뒤 휠', '앞 튜브', '뒤 튜브', '림테이프', '밸브'],
  part:    ['체인', '앞 브레이크패드', '뒤 브레이크패드', '스프라켓', '체인링', '실런트', '체인오일', '변속 케이블', '그립', '로터', '페달 클릿'],
  service: ['체인 세척·오일', '브레이크 블리딩', '포크 오버홀', '쇽 오버홀', '변속 조정', '휠 정비', '베어링 교체', '세차', '전체 점검']
};

let data = { bikes: [], records: [] };
let curBike = 'all', listType = 'all';
let calY, calM, selDay = null, statY;
let editRecId = null, editBikeId = null, fType = 'wheel';

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const today = () => { const d = new Date(); return ymd(d); };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const bikeName = id => (data.bikes.find(b => b.id === id) || {}).name || '-';

// ===== 저장/불러오기 =====
async function load() {
  try { const c = localStorage.getItem(LS); if (c) data = JSON.parse(c); } catch (e) {}
  render();
  setSync('불러오는 중…');
  try {
    const r = await fetch(API, { headers: { 'X-Key': KEY } });
    if (r.ok) {
      const j = await r.json();
      if (j && j.bikes) { data = j; cache(); }
      setSync('');
    } else setSync('서버 오류');
  } catch (e) { setSync('오프라인'); }
  if (!data.bikes.length) { data.bikes.push({ id: uid(), name: 'MTB', km: 0 }); save(); }
  render();
}
function cache() { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {} }
async function save() {
  cache();
  setSync('저장 중…');
  try {
    const r = await fetch(API, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Key': KEY }, body: JSON.stringify(data) });
    setSync(r.ok ? '저장됨' : '저장 실패');
    if (r.ok) setTimeout(() => setSync(''), 1500);
  } catch (e) { setSync('저장 실패 (오프라인)'); }
}
function setSync(t) { $('syncState').textContent = t; }

// ===== 공통 =====
function recsOfBike() {
  return data.records.filter(r => curBike === 'all' || r.bikeId === curBike)
    .sort((a, b) => b.date.localeCompare(a.date) || (b.km || 0) - (a.km || 0));
}
function recRow(r) {
  const t = TYPES[r.type];
  const sub = [r.date, data.bikes.length > 1 ? bikeName(r.bikeId) : '', r.km ? r.km.toLocaleString() + 'km' : '', r.product].filter(Boolean).join(' · ');
  return `<div class="row" onclick="openRec('${r.id}')">
    <div class="l"><div class="t"><span class="tag ${r.type}"></span>${r.item || t.name}</div><div class="s">${sub}</div></div>
    <div class="r">${r.price ? won(r.price) : ''}</div></div>`;
}

function render() {
  // 자전거 칩
  const bikes = data.bikes;
  let chips = '';
  if (bikes.length > 1) chips += `<button class="chip ${curBike === 'all' ? 'on' : ''}" onclick="pickBike('all')">전체</button>`;
  bikes.forEach(b => chips += `<button class="chip ${curBike === b.id || (bikes.length === 1) ? 'on' : ''}" onclick="pickBike('${b.id}')">${b.name}</button>`);
  $('bikeChips').innerHTML = chips;
  if (bikes.length === 1) curBike = bikes[0].id;

  renderHome(); renderList(); renderCal(); renderStat(); renderSet();
}
function pickBike(id) { curBike = id; render(); }

// ===== 홈 =====
function renderHome() {
  const bike = data.bikes.find(b => b.id === curBike);
  $('kmCard').classList.toggle('hide', !bike);
  if (bike) $('kmNow').textContent = (bike.km || 0).toLocaleString() + ' km';

  const recs = recsOfBike();
  // 품목별 가장 최근 기록
  const seen = {}, since = [];
  recs.forEach(r => {
    const k = r.bikeId + '|' + (r.item || r.type);
    if (!seen[k]) { seen[k] = 1; since.push(r); }
  });
  $('sinceList').innerHTML = since.length ? since.map(r => {
    const d = daysBetween(r.date, today());
    const b = data.bikes.find(x => x.id === r.bikeId);
    const kmTxt = (r.km && b && b.km >= r.km) ? ' · ' + (b.km - r.km).toLocaleString() + 'km' : '';
    return `<div class="row" onclick="openRec('${r.id}')">
      <div class="l"><div class="t"><span class="tag ${r.type}"></span>${r.item || TYPES[r.type].name}</div>
      <div class="s">${r.date}${data.bikes.length > 1 && curBike === 'all' ? ' · ' + bikeName(r.bikeId) : ''}</div></div>
      <div class="r"><b>${d}일</b>${kmTxt}</div></div>`;
  }).join('') : '<div class="empty">아직 기록이 없습니다</div>';

  $('recentList').innerHTML = recs.length ? recs.slice(0, 5).map(recRow).join('') : '<div class="empty">＋ 버튼으로 기록을 추가하세요</div>';
}
function editKm() {
  const b = data.bikes.find(x => x.id === curBike);
  if (!b) return;
  const v = prompt('현재 누적 km', b.km || 0);
  if (v === null || v === '' || isNaN(v)) return;
  b.km = Number(v); save(); render();
}

// ===== 기록 목록 =====
function renderList() {
  let c = `<button class="chip ${listType === 'all' ? 'on' : ''}" onclick="pickType('all')">전체</button>`;
  Object.keys(TYPES).forEach(k => c += `<button class="chip ${listType === k ? 'on' : ''}" onclick="pickType('${k}')">${TYPES[k].icon} ${TYPES[k].name}</button>`);
  $('typeChips').innerHTML = c;
  const recs = recsOfBike().filter(r => listType === 'all' || r.type === listType);
  $('allList').innerHTML = recs.length ? recs.map(recRow).join('') : '<div class="empty">기록이 없습니다</div>';
}
function pickType(t) { listType = t; renderList(); }

// ===== 달력 =====
function renderCal() {
  const first = new Date(calY, calM, 1), last = new Date(calY, calM + 1, 0);
  $('calTitle').textContent = `${calY}년 ${calM + 1}월`;
  const recs = recsOfBike();
  let h = ['일', '월', '화', '수', '목', '금', '토'].map(w => `<div class="w">${w}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) h += '<div></div>';
  for (let d = 1; d <= last.getDate(); d++) {
    const ds = ymd(new Date(calY, calM, d));
    const types = [...new Set(recs.filter(r => r.date === ds).map(r => r.type))];
    h += `<div class="d ${ds === today() ? 'today' : ''} ${ds === selDay ? 'sel' : ''}" onclick="pickDay('${ds}')">${d}
      <div class="dots">${types.map(t => `<span class="${t}"></span>`).join('')}</div></div>`;
  }
  $('calGrid').innerHTML = h;
  const day = selDay || today();
  $('dayTitle').textContent = day;
  const dr = recs.filter(r => r.date === day);
  $('dayList').innerHTML = dr.length ? dr.map(recRow).join('') : '<div class="empty">기록 없음</div>';
}
function moveMonth(n) { calM += n; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } renderCal(); }
function pickDay(d) { selDay = d; renderCal(); }

// ===== 통계 =====
function renderStat() {
  $('yearTitle').textContent = statY + '년';
  const all = recsOfBike();
  const yr = all.filter(r => r.date.startsWith(statY + ''));
  $('yearTotal').textContent = won(yr.reduce((s, r) => s + (r.price || 0), 0));
  $('yearByType').innerHTML = Object.keys(TYPES).map(k => {
    const s = yr.filter(r => r.type === k).reduce((a, r) => a + (r.price || 0), 0);
    return `<div><div class="k"><span class="tag ${k}"></span>${TYPES[k].name}</div><div class="n">${won(s)}</div></div>`;
  }).join('');
  const months = Array(12).fill(0);
  yr.forEach(r => months[Number(r.date.slice(5, 7)) - 1] += (r.price || 0));
  const max = Math.max(...months, 1);
  $('monthBars').innerHTML = months.map((v, i) => `<div class="b"><i style="height:${v / max * 100}%"></i><span>${i + 1}</span></div>`).join('');
  const byItem = {};
  all.forEach(r => { const k = r.item || TYPES[r.type].name; byItem[k] = (byItem[k] || 0) + (r.price || 0); });
  const list = Object.entries(byItem).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  $('itemCost').innerHTML = list.length ? list.map(([k, v]) => `<div class="row"><div class="l"><div class="t">${k}</div></div><div class="r">${won(v)}</div></div>`).join('') : '<div class="empty">비용 기록이 없습니다</div>';
}
function moveYear(n) { statY += n; renderStat(); }

// ===== 설정 =====
function renderSet() {
  $('bikeList').innerHTML = data.bikes.map(b => `<div class="row" onclick="openBike('${b.id}')">
    <div class="l"><div class="t">🚲 ${b.name}</div><div class="s">${(b.km || 0).toLocaleString()} km · 기록 ${data.records.filter(r => r.bikeId === b.id).length}개</div></div>
    <div class="r">수정 ›</div></div>`).join('');
}
function openBike(id) {
  editBikeId = id || null;
  const b = data.bikes.find(x => x.id === id);
  $('bikeTitle').textContent = b ? '자전거 수정' : '자전거 추가';
  $('bName').value = b ? b.name : '';
  $('bKm').value = b ? (b.km || '') : '';
  $('bikeDel').classList.toggle('hide', !b || data.bikes.length < 2);
  $('bikeModal').classList.add('show');
}
function saveBike() {
  const name = $('bName').value.trim();
  if (!name) return alert('이름을 입력하세요');
  const km = Number($('bKm').value) || 0;
  if (editBikeId) { const b = data.bikes.find(x => x.id === editBikeId); b.name = name; b.km = km; }
  else data.bikes.push({ id: uid(), name, km });
  closeModal('bikeModal'); save(); render();
}
function delBike() {
  if (!confirm('이 자전거와 기록을 모두 삭제할까요?')) return;
  data.records = data.records.filter(r => r.bikeId !== editBikeId);
  data.bikes = data.bikes.filter(b => b.id !== editBikeId);
  curBike = 'all';
  closeModal('bikeModal'); save(); render();
}
function exportJson() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = '용용이바이크_백업_' + today() + '.json';
  a.click();
}
function importJson(e) {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j.bikes || !j.records) throw 0;
      if (!confirm('현재 데이터를 백업 파일로 바꿀까요?')) return;
      data = j; curBike = 'all'; save(); render(); alert('불러왔습니다');
    } catch (x) { alert('올바른 백업 파일이 아닙니다'); }
  };
  rd.readAsText(f); e.target.value = '';
}

// ===== 기록 입력 =====
function setType(t) {
  fType = t;
  document.querySelectorAll('.types button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('itemList').innerHTML = ITEMS[t].map(i => `<option value="${i}">`).join('');
  $('fPlaceLabel').textContent = TYPES[t].place;
}
document.querySelectorAll('.types button').forEach(b => b.onclick = () => setType(b.dataset.t));

function openRec(id) {
  editRecId = id || null;
  const r = data.records.find(x => x.id === id);
  $('fBike').innerHTML = data.bikes.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  $('recTitle').textContent = r ? '기록 수정' : '기록 추가';
  setType(r ? r.type : (listType !== 'all' ? listType : 'wheel'));
  const defBike = r ? r.bikeId : (curBike !== 'all' ? curBike : data.bikes[0].id);
  $('fBike').value = defBike;
  $('fDate').value = r ? r.date : (selDay && !$('tab-cal').classList.contains('hide') ? selDay : today());
  const b = data.bikes.find(x => x.id === defBike);
  $('fKm').value = r ? (r.km || '') : (b && b.km ? b.km : '');
  $('fItem').value = r ? (r.item || '') : '';
  $('fProduct').value = r ? (r.product || '') : '';
  $('fPrice').value = r ? (r.price || '') : '';
  $('fPlace').value = r ? (r.place || '') : '';
  $('fMemo').value = r ? (r.memo || '') : '';
  $('recDel').classList.toggle('hide', !r);
  $('recModal').classList.add('show');
}
function saveRec() {
  const rec = {
    id: editRecId || uid(), type: fType, bikeId: $('fBike').value,
    date: $('fDate').value || today(),
    km: Number($('fKm').value) || 0,
    item: $('fItem').value.trim(), product: $('fProduct').value.trim(),
    price: Number($('fPrice').value) || 0,
    place: $('fPlace').value.trim(), memo: $('fMemo').value.trim()
  };
  if (!rec.item) return alert('품목을 입력하세요');
  if (editRecId) data.records = data.records.map(r => r.id === editRecId ? rec : r);
  else data.records.push(rec);
  // 기록 km가 자전거 현재 km보다 크면 자동 갱신
  const b = data.bikes.find(x => x.id === rec.bikeId);
  if (b && rec.km > (b.km || 0)) b.km = rec.km;
  closeModal('recModal'); save(); render();
}
function delRec() {
  if (!confirm('이 기록을 삭제할까요?')) return;
  data.records = data.records.filter(r => r.id !== editRecId);
  closeModal('recModal'); save(); render();
}
function closeModal(id) { $(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(m => m.onclick = e => { if (e.target === m) m.classList.remove('show'); });

// ===== 탭 =====
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['home', 'list', 'cal', 'stat', 'set'].forEach(t => $('tab-' + t).classList.toggle('hide', t !== b.dataset.tab));
  window.scrollTo(0, 0);
});

// ===== 시작 =====
const now = new Date();
calY = now.getFullYear(); calM = now.getMonth(); statY = now.getFullYear();
load();
</script>
</body>
</html>
