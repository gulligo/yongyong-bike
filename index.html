<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>용용이 바이크</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f172a; --card: #1e293b; --line: #334155; --text: #f1f5f9; --sub: #94a3b8;
    --wheel: #38bdf8; --part: #fbbf24; --service: #4ade80; --red: #f87171;
  }
  body { font-family: -apple-system, 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
  header { padding: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  header h1 { font-size: 22px; }
  #syncState { font-size: 12px; color: var(--sub); }
  main { padding: 0 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h3 { font-size: 15px; margin-bottom: 10px; color: var(--sub); font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; }
  .chip { padding: 7px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); color: var(--text); font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .l { flex: 1; min-width: 0; }
  .row .t { font-size: 15px; }
  .row .s { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .row .r { text-align: right; font-size: 14px; white-space: nowrap; margin-left: 10px; }
  .tag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .wheel { background: var(--wheel); } .part { background: var(--part); } .service { background: var(--service); }
  .empty { color: var(--sub); text-align: center; padding: 20px 0; font-size: 14px; }
  .big { font-size: 26px; font-weight: 700; }
  .kmbox { display: flex; justify-content: space-between; align-items: center; }
  .btn { background: var(--line); color: var(--text); border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; }
  .btn.main { background: var(--wheel); color: var(--bg); font-weight: 700; }
  .btn.del { background: var(--red); color: var(--bg); }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); z-index: 20; }
  nav button { flex: 1; background: none; border: none; color: var(--sub); padding: 12px 0 16px; font-size: 13px; }
  nav button.on { color: var(--text); font-weight: 700; }
  .fab { position: fixed; right: 18px; bottom: 80px; width: 56px; height: 56px; border-radius: 50%; background: var(--wheel); color: var(--bg); font-size: 30px; border: none; z-index: 20; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 30; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px 28px; }
  .sheet h2 { font-size: 18px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 5px; }
  input, select, textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px; font-size: 16px; font-family: inherit; }
  textarea { min-height: 60px; resize: vertical; }
  .types { display: flex; gap: 8px; }
  .types button { flex: 1; padding: 11px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px; }
  .types button.on[data-t="wheel"] { background: var(--wheel); color: var(--bg); }
  .types button.on[data-t="part"] { background: var(--part); color: var(--bg); }
  .types button.on[data-t="service"] { background: var(--service); color: var(--bg); }
  .two { display: flex; gap: 10px; } .two > div { flex: 1; }
  .acts { display: flex; gap: 10px; margin-top: 18px; } .acts .btn { flex: 1; padding: 13px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .w { text-align: center; font-size: 12px; color: var(--sub); padding: 4px 0; }
  .cal .d { aspect-ratio: 1; background: var(--bg); border-radius: 8px; font-size: 13px; padding: 4px; display: flex; flex-direction: column; align-items: center; }
  .cal .d.sel { outline: 2px solid var(--text); }
  .cal .d.today { color: var(--wheel); font-weight: 700; }
  .cal .d .dots { display: flex; gap: 2px; margin-top: auto; margin-bottom: 3px; }
  .cal .d .dots span { width: 6px; height: 6px; border-radius: 50%; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bars .b i { width: 100%; background: var(--wheel); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bars .b span { font-size: 10px; color: var(--sub); margin-top: 4px; }
  .sum3 { display: flex; gap: 8px; }
  .sum3 > div { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
  .sum3 .n { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .sum3 .k { font-size: 12px; color: var(--sub); }
  .hide { display: none; }
  .bc-top { display: flex; gap: 12px; align-items: center; }
  .bc-info { flex: 1; min-width: 0; }
  .bc-name { font-size: 30px; font-weight: 800; }
  .bc-model { font-size: 15px; color: var(--sub); margin-top: 4px; }
  .bc-photo { width: 48%; aspect-ratio: 4/3; border-radius: 14px; background: var(--bg) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 34px; color: var(--sub); }
  .bc-photo.has { font-size: 0; }
  .bc-photo.pick { width: 100%; aspect-ratio: 16/9; font-size: 15px; border: 1px dashed var(--line); }
  .bc-photo.pick.has { font-size: 0; border: none; }
  .bc-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--sub); }
  .bc-foot b { flex: 1; color: var(--text); font-size: 17px; }
  .al { background: var(--bg); border-radius: 12px; padding: 12px 12px 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--service); }
  .al.soon { border-left-color: var(--part); }
  .al.over { border-left-color: var(--red); }
  .al-top { display: flex; align-items: center; gap: 10px; }
  .al-top .l { flex: 1; min-width: 0; }
  .al .nm { font-size: 16px; font-weight: 700; }
  .al .st { font-size: 13px; font-weight: 700; margin-top: 4px; color: var(--service); }
  .al.soon .st { color: var(--part); }
  .al.over .st { color: var(--red); }
  .al .fr { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .al-bar { height: 6px; background: var(--card); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .al-bar i { display: block; height: 100%; background: var(--service); border-radius: 3px; }
  .al.soon .al-bar i { background: var(--part); }
  .al.over .al-bar i { background: var(--red); }
  .done { border: 2px solid var(--service); background: none; color: var(--service); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .badge { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; background: var(--part); color: var(--bg); font-size: 11px; font-weight: 700; text-align: center; padding: 0 5px; margin-left: 5px; }
  .badge.red { background: var(--red); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 56px; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 14px; }
  .seg button.on { background: var(--wheel); color: var(--bg); font-weight: 700; border-color: var(--wheel); }
  .stepper { display: flex; gap: 8px; align-items: center; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--line); color: var(--text); font-size: 18px; }
  .stepper input { text-align: center; font-size: 20px; font-weight: 700; }
  .toggle { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 14px; }
  .toggle input { width: 22px; height: 22px; }
  .psi2 { display: flex; gap: 10px; }
  .psi2 > div { flex: 1; background: var(--bg); border-radius: 12px; padding: 14px 8px; text-align: center; border: 2px solid var(--wheel); }
  .psi2 > div.rear { border-color: var(--service); }
  .psi2 .k { font-size: 13px; color: var(--sub); }
  .psi2 .n { font-size: 22px; font-weight: 800; margin: 6px 0 2px; color: var(--wheel); }
  .psi2 .rear .n { color: var(--service); }
  .psi2 .u { font-size: 12px; color: var(--sub); }
  .psi2 .o { font-size: 14px; font-weight: 700; margin-top: 8px; }
  .note { font-size: 12px; color: var(--sub); margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <h1>🚲 용용이 바이크</h1>
  <span id="syncState"></span>
</header>

<main>
  <div class="chips" id="bikeChips"></div>

  <!-- 홈 -->
  <section id="tab-home">
    <div class="card bikecard" id="kmCard">
      <div class="bc-top" onclick="openBike(curBike)">
        <div class="bc-info">
          <div class="bc-name" id="bcName"></div>
          <div class="bc-model" id="bcModel"></div>
        </div>
        <div class="bc-photo" id="bcPhoto">🚲</div>
      </div>
      <div class="bc-foot">
        <span>총 누적 거리</span>
        <b id="kmNow">0 km</b>
        <button class="btn" onclick="editKm()">km 수정</button>
      </div>
    </div>
    <div class="card" id="alertCard">
      <div class="kmbox" style="margin-bottom:10px">
        <h3 style="margin:0" id="alertHead">정비 시기</h3>
        <button class="btn" id="alertAdd" onclick="openAlert()">+ 품목 추가</button>
      </div>
      <div id="alertList"></div>
    </div>
    <div class="card">
      <h3>마지막 교체·정비 이후</h3>
      <div id="sinceList"></div>
    </div>
    <div class="card">
      <h3>최근 기록</h3>
      <div id="recentList"></div>
    </div>
  </section>

  <!-- 기록 -->
  <section id="tab-list" class="hide">
    <div class="chips" id="typeChips"></div>
    <div class="card"><div id="allList"></div></div>
  </section>

  <!-- 달력 -->
  <section id="tab-cal" class="hide">
    <div class="card">
      <div class="cal-head">
        <button class="btn" onclick="moveMonth(-1)">◀</button>
        <b id="calTitle"></b>
        <button class="btn" onclick="moveMonth(1)">▶</button>
      </div>
      <div class="cal" id="calGrid"></div>
    </div>
    <div class="card"><h3 id="dayTitle"></h3><div id="dayList"></div></div>
  </section>

  <!-- 통계 -->
  <section id="tab-stat" class="hide">
    <div class="card">
      <div class="cal-head">
        <button class="btn" onclick="moveYear(-1)">◀</button>
        <b id="yearTitle"></b>
        <button class="btn" onclick="moveYear(1)">▶</button>
      </div>
      <div class="big" id="yearTotal" style="text-align:center;margin:6px 0 12px"></div>
      <div class="sum3" id="yearByType"></div>
    </div>
    <div class="card">
      <h3>월별 비용</h3>
      <div class="bars" id="monthBars"></div>
    </div>
    <div class="card">
      <h3>품목별 비용 (전체 기간)</h3>
      <div id="itemCost"></div>
    </div>
  </section>

  <!-- 계산 -->
  <section id="tab-calc" class="hide">
    <div id="calc-psi">
      <div class="card">
        <label style="margin-top:0">라이더 체중 (kg)</label>
        <div class="stepper">
          <button onclick="stepW(-1)">-1</button>
          <input type="number" id="pW" inputmode="decimal" oninput="calcPsi()">
          <button onclick="stepW(1)">+1</button>
        </div>
        <label>자전거 무게 (kg)</label>
        <input type="number" id="pBike" inputmode="decimal" oninput="calcPsi()">
        <label>타이어 세팅</label>
        <div class="seg" id="pTube">
          <button data-v="tube">튜브</button>
          <button data-v="tubeless">튜블리스</button>
        </div>
        <label>타이어 폭</label>
        <div class="seg" id="pWidth"></div>
        <div class="toggle"><span>🌧 우천 / 젖은 노면 (5% 감압)</span><input type="checkbox" id="pWet" onchange="calcPsi()"></div>
      </div>
      <div class="psi2" id="psiOut"></div>
      <div class="card note" style="margin-top:12px">
        • 참고값입니다 (무게 배분 로드·그래블 앞 40%·뒤 60%, MTB 앞 45%·뒤 55%). 타이어·림에 적힌 최대 압력을 넘기지 마세요.<br>
        • 노면이 거칠거나 승차감이 중요하면 낮은 쪽, 포장도로 고속 주행이면 높은 쪽에 맞추세요.
      </div>
    </div>
  </section>

  <!-- 설정 -->
  <section id="tab-set" class="hide">
    <div class="card">
      <h3>자전거</h3>
      <div id="bikeList"></div>
      <button class="btn main" style="width:100%;margin-top:10px" onclick="openBike()">+ 자전거 추가</button>
    </div>
    <div class="card">
      <h3>백업</h3>
      <div class="two">
        <button class="btn" style="flex:1" onclick="exportJson()">내보내기</button>
        <button class="btn" style="flex:1" onclick="document.getElementById('importFile').click()">불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json" class="hide" onchange="importJson(event)">
    </div>
  </section>
</main>

<button class="fab" onclick="openRec()">＋</button>

<nav>
  <button data-tab="home" class="on">홈</button>
  <button data-tab="list">기록</button>
  <button data-tab="cal">달력</button>
  <button data-tab="stat">통계</button>
  <button data-tab="calc">공기압</button>
  <button data-tab="set">설정</button>
</nav>

<!-- 기록 입력 -->
<div class="modal" id="recModal">
  <div class="sheet">
    <h2 id="recTitle">기록 추가</h2>
    <div class="types">
      <button data-t="wheel">🛞 바퀴</button>
      <button data-t="part">🔩 소모품</button>
      <button data-t="service">🔧 정비</button>
    </div>
    <label>자전거</label>
    <select id="fBike"></select>
    <div class="two">
      <div><label>날짜</label><input type="date" id="fDate"></div>
      <div><label>누적 km</label><input type="number" id="fKm" inputmode="numeric" placeholder="선택"></div>
    </div>
    <label>품목</label>
    <input id="fItem" list="itemList" placeholder="예: 뒤 타이어">
    <datalist id="itemList"></datalist>
    <label>제품명</label>
    <input id="fProduct" placeholder="예: 맥시스 미니언 DHF 29x2.5">
    <div class="two">
      <div><label>가격 (원)</label><input type="number" id="fPrice" inputmode="numeric" placeholder="0"></div>
      <div><label id="fPlaceLabel">구매처</label><input id="fPlace" placeholder="선택"></div>
    </div>
    <label>메모</label>
    <textarea id="fMemo"></textarea>
    <div class="acts">
      <button class="btn del hide" id="recDel" onclick="delRec()">삭제</button>
      <button class="btn" onclick="closeModal('recModal')">취소</button>
      <button class="btn main" onclick="saveRec()">저장</button>
    </div>
  </div>
</div>

<!-- 자전거 입력 -->
<div class="modal" id="bikeModal">
  <div class="sheet">
    <h2 id="bikeTitle">자전거 추가</h2>
    <label>사진</label>
    <div class="bc-photo pick" id="bPhotoPrev" onclick="$('bPhoto').click()">📷 사진 선택</div>
    <input type="file" id="bPhoto" accept="image/*" class="hide" onchange="pickPhoto(event)">
    <label>이름</label>
    <input id="bName" placeholder="예: 트랙">
    <label>모델</label>
    <input id="bModel" placeholder="예: 프로칼리버 9.9">
    <label>총 누적 km</label>
    <input type="number" id="bKm" inputmode="numeric" placeholder="0">
    <div class="acts">
      <button class="btn del hide" id="bikeDel" onclick="delBike()">삭제</button>
      <button class="btn" onclick="closeModal('bikeModal')">취소</button>
      <button class="btn main" onclick="saveBike()">저장</button>
    </div>
  </div>
</div>

<!-- 교체 알림 입력 -->
<div class="modal" id="alertModal">
  <div class="sheet">
    <h2 id="alertTitle">품목 추가</h2>
    <label>품목</label>
    <input id="aItem" list="alertItems" placeholder="예: 체인">
    <datalist id="alertItems"></datalist>
    <label>정비 주기 (둘 중 하나만 넣어도 됩니다 · 둘 다 넣으면 먼저 닿는 쪽)</label>
    <div class="two">
      <div><input type="number" id="aEvery" inputmode="numeric" placeholder="km"></div>
      <div><input type="number" id="aMonths" inputmode="numeric" placeholder="개월"></div>
    </div>
    <label>마지막 교체·정비</label>
    <div class="two">
      <div><input type="date" id="aDate"></div>
      <div><input type="number" id="aStart" inputmode="numeric" placeholder="km"></div>
    </div>
    <div class="acts">
      <button class="btn del hide" id="alertDel" onclick="delAlert()">삭제</button>
      <button class="btn" onclick="closeModal('alertModal')">취소</button>
      <button class="btn main" onclick="saveAlert()">저장</button>
    </div>
  </div>
</div>

<script>
// ===== 설정 (Worker 주소와 키를 바꿔 주세요) =====
const API = 'https://yongyong-bike.86400seccc.workers.dev/data';
const KEY = 'yongyong-1234';
const LS = 'yongyong-bike-data';

const TYPES = {
  wheel:   { name: '바퀴',   icon: '🛞', place: '구매처' },
  part:    { name: '소모품', icon: '🔩', place: '구매처' },
  service: { name: '정비',   icon: '🔧', place: '정비한 곳' }
};
const ITEMS = {
  wheel:   ['앞 타이어', '뒤 타이어', '앞 휠', '뒤 휠', '앞 튜브', '뒤 튜브', '림테이프', '밸브'],
  part:    ['체인', '앞 브레이크패드', '뒤 브레이크패드', '스프라켓', '체인링', '실런트', '체인오일', '변속 케이블', '그립', '로터', '페달 클릿'],
  service: ['체인 세척·오일', '브레이크 블리딩', '포크 오버홀', '쇽 오버홀', '변속 조정', '휠 정비', '베어링 교체', '세차', '전체 점검']
};

let data = { bikes: [], records: [] };
let curBike = 'all', listType = 'all';
let calY, calM, selDay = null, statY;
let editRecId = null, editBikeId = null, fType = 'wheel';

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const today = () => { const d = new Date(); return ymd(d); };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const bikeName = id => (data.bikes.find(b => b.id === id) || {}).name || '-';

// ===== 저장/불러오기 =====
async function load() {
  try { const c = localStorage.getItem(LS); if (c) data = JSON.parse(c); } catch (e) {}
  migrate();
  render();
  setSync('불러오는 중…');
  try {
    const r = await fetch(API, { headers: { 'X-Key': KEY } });
    if (r.ok) {
      const j = await r.json();
      if (j && j.bikes) { data = j; cache(); }
      setSync('');
    } else setSync('서버 오류');

// ===== 정비 시기 (소모품 알림) =====
const DEFAULTS = [['체인', 3000, 0], ['앞 브레이크패드', 2000, 0], ['뒤 브레이크패드', 2000, 0], ['뒤 타이어', 4000, 0], ['실런트', 0, 3], ['브레이크 블리딩', 0, 12]];
function defaultAlerts(km) {
  return DEFAULTS.map(([item, everyKm, everyMonths]) => ({ id: uid(), item, everyKm, everyMonths, startKm: km || 0, startDate: today() }));
}
function addDefaults() {
  const b = data.bikes.find(x => x.id === curBike);
  b.alerts = defaultAlerts(b.km); save(); render();
}
function addMonths(ds, m) { const d = new Date(ds); d.setMonth(d.getMonth() + m); return ymd(d); }
function alertStatus(b, a) {
  let kmR = -1, dayR = -1, kmLeft = 0, daysLeft = 0, due = '';
  if (a.everyKm) {
    const used = Math.max(0, (b.km || 0) - (a.startKm || 0));
    kmLeft = a.everyKm - used; kmR = used / a.everyKm;
  }
  if (a.everyMonths) {
    const start = a.startDate || today();
    due = addMonths(start, a.everyMonths);
    daysLeft = daysBetween(today(), due);
    dayR = 1 - daysLeft / (daysBetween(start, due) || 1);
  }
  const ratio = Math.max(kmR, dayR, 0);
  const cls = ratio >= 1 ? 'over' : ratio >= 0.8 ? 'soon' : 'ok';
  const byKm = kmR >= dayR;
  let text;
  if (cls === 'over') text = byKm ? `정비 시기 · ${(-kmLeft).toLocaleString()} km 초과` : `정비 시기 · ${due}부터 초과`;
  else text = (cls === 'soon' ? '곧 정비 · ' : '양호 · ') + (byKm ? `${kmLeft.toLocaleString()} km 남음` : `${due}까지(${daysLeft}일)`);
  return { ratio, cls, text };
}
function needCount(b) { return (b.alerts || []).map(a => alertStatus(b, a).cls).filter(c => c !== 'ok'); }
function badge(b) {
  const n = needCount(b);
  return n.length ? `<span class="badge ${n.includes('over') ? 'red' : ''}">${n.length}</span>` : '';
}

let newPhoto = null;
function photoUrl(b) { return API.replace(/\/data$/, '') + '/photo/' + b.id + '?v=' + b.photoV; }
function setPhoto(el, b) {
  if (b && b.photoV) { el.style.backgroundImage = `url('${photoUrl(b)}')`; el.classList.add('has'); }
  else { el.style.backgroundImage = ''; el.classList.remove('has'); }
}
function pickPhoto(e) {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(bl => {
      newPhoto = bl;
      const el = $('bPhotoPrev');
      el.style.backgroundImage = `url('${URL.createObjectURL(bl)}')`; el.classList.add('has');
    }, 'image/jpeg', 0.85);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
}
async function uploadPhoto(id, blob) {
  setSync('사진 올리는 중…');
  const r = await fetch(API.replace(/\/data$/, '') + '/photo/' + id, { method: 'PUT', headers: { 'Content-Type': 'image/jpeg', 'X-Key': KEY }, body: blob });

}
function delRec() {
  if (!confirm('이 기록을 삭제할까요?')) return;
  data.records = data.records.filter(r => r.id !== editRecId);
  closeModal('recModal'); save(); render();
}
function closeModal(id) { $(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(m => m.onclick = e => { if (e.target === m) m.classList.remove('show'); });

// ===== 탭 =====
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['home', 'list', 'cal', 'stat', 'calc', 'set'].forEach(t => $('tab-' + t).classList.toggle('hide', t !== b.dataset.tab));
  window.scrollTo(0, 0);
});

// ===== 타이어 공기압 =====
const WIDTHS = [['23c', 23], ['25c', 25], ['28c', 28], ['30c', 30], ['32c', 32], ['35c', 35], ['38c', 38], ['40c', 40], ['45c', 45],
  ['2.2"', 2.2], ['2.3"', 2.3], ['2.4"', 2.4], ['2.5"', 2.5], ['2.6"', 2.6]];
const PSI_LS = 'yongyong-bike-psi';
let psi = { w: 70, bike: 12, tube: 'tube', width: 2.3, wet: false };
try { Object.assign(psi, JSON.parse(localStorage.getItem(PSI_LS) || '{}')); } catch (e) {}
function initPsi() {
  $('pW').value = psi.w; $('pBike').value = psi.bike; $('pWet').checked = psi.wet;
  $('pWidth').innerHTML = WIDTHS.map(([t, v]) => `<button data-v="${v}">${t}</button>`).join('');
  document.querySelectorAll('#pWidth button').forEach(b => b.onclick = () => { psi.width = Number(b.dataset.v); calcPsi(); });
  document.querySelectorAll('#pTube button').forEach(b => b.onclick = () => { psi.tube = b.dataset.v; calcPsi(); });
  calcPsi();
}
function stepW(n) { $('pW').value = (Number($('pW').value) || 0) + n; calcPsi(); }
function calcPsi() {
  psi.w = Number($('pW').value) || 0; psi.bike = Number($('pBike').value) || 0; psi.wet = $('pWet').checked;
  try { localStorage.setItem(PSI_LS, JSON.stringify(psi)); } catch (e) {}
  document.querySelectorAll('#pWidth button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === psi.width));
  document.querySelectorAll('#pTube button').forEach(b => b.classList.toggle('on', b.dataset.v === psi.tube));
  const lb = (psi.w + psi.bike) * 2.2046, mtb = psi.width < 10;
  let f, r;
  if (mtb) { // MTB(인치): 앞 45% · 뒤 55%
    f = lb * 0.45 / (psi.width * 1.75); r = lb * 0.55 / (psi.width * 1.75);
  } else {   // 로드·그래블(mm): 앞 40% · 뒤 60%, 15% 타이어 처짐 공식
    const k = Math.pow(psi.width, 1.5785);
    f = 153.6 * lb * 0.4 / k - 7.1685; r = 153.6 * lb * 0.6 / k - 7.1685;
  }
  const m = (psi.tube === 'tubeless' ? 0.9 : 1) * (psi.wet ? 0.95 : 1);
  f = Math.max(0, f * m); r = Math.max(0, r * m);
  const box = (cls, name, v) => `<div class="${cls}"><div class="k">${name}</div>
    <div class="n">${(v * 0.92).toFixed(1)} ~ ${(v * 1.06).toFixed(1)}</div><div class="u">PSI</div>
    <div class="u">${(v * 0.92 * 0.0689).toFixed(2)} ~ ${(v * 1.06 * 0.0689).toFixed(2)} Bar</div>
    <div class="o">최적 ${v.toFixed(1)} PSI</div></div>`;
  $('psiOut').innerHTML = box('', '앞 타이어', f) + box('rear', '뒤 타이어', r);
}

// ===== 시작 =====
const now = new Date();
calY = now.getFullYear(); calM = now.getMonth(); statY = now.getFullYear();
initPsi();
load();
</script>
